[project]
name = "woaile-gzh-publisher"
version = "0.1.0"
description = "「我AI了」公众号定制发布工具 - Markdown 转公众号格式并发布到草稿箱"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "markdown>=3.5.0",
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0.0",
    "premailer>=3.10.0",
]

[project.scripts]
woaile-gzh = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["."]
